name: Terraform Gate

# Validates Terraform changes on PRs: format check, validation, and plan.
# Follows the same gate pattern as code-quality-gate.yml and security-gate.yml.

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "terraform/**"

permissions:
  contents: read
  pull-requests: write
  id-token: write  # Required for WIF auth (terraform plan)

env:
  TF_VERSION: "1.5"
  TF_IN_AUTOMATION: "true"

jobs:
  terraform-check:
    name: Terraform Validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, staging, prod]
    defaults:
      run:
        working-directory: terraform/environments/${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~${{ env.TF_VERSION }}"

      - name: Terraform fmt check
        id: fmt
        run: terraform fmt -check -recursive ../../
        continue-on-error: true

      - name: Terraform init (no backend)
        id: init
        run: terraform init -backend=false

      - name: Terraform validate
        id: validate
        run: terraform validate -no-color

  # Plan only runs on dev to avoid needing multiple GCP project credentials.
  # Requires WIF_PROVIDER and GCP_SERVICE_ACCOUNT secrets to be configured.
  terraform-plan:
    name: Terraform Plan (dev)
    runs-on: ubuntu-latest
    needs: terraform-check
    if: vars.ENABLE_TF_PLAN == 'true'
    defaults:
      run:
        working-directory: terraform/environments/dev
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~${{ env.TF_VERSION }}"

      - name: Authenticate to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Terraform init
        run: terraform init

      - name: Terraform plan
        id: plan
        run: terraform plan -no-color -input=false 2>&1 | tee /tmp/plan.txt
        continue-on-error: true

      - name: Post plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PLAN_EXIT: ${{ steps.plan.outcome }}
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('/tmp/plan.txt', 'utf8').slice(0, 60000);
            const outcome = process.env.PLAN_EXIT;
            const icon = outcome === 'success' ? '✅' : '❌';

            const body = [
              '## 🏗️ Terraform Plan (dev)',
              '',
              `**Status**: ${icon} ${outcome}`,
              '',
              '<details><summary>Show Plan Output</summary>',
              '',
              '```hcl',
              plan,
              '```',
              '',
              '</details>',
              '',
              '_Triggered by changes to `terraform/**`_',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.body.includes('## 🏗️ Terraform Plan (dev)')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Plan gate decision
        if: steps.plan.outcome == 'failure'
        run: |
          echo "::error::Terraform plan failed — review the plan output above"
          exit 1

  # Gate job for branch protection status check
  terraform-gate:
    name: Terraform Gate
    if: always()
    needs: [terraform-check, terraform-plan]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          check="${{ needs.terraform-check.result }}"
          plan="${{ needs.terraform-plan.result }}"

          if [[ "$check" == "failure" ]]; then
            echo "::error::Terraform validation failed"
            exit 1
          fi

          if [[ "$plan" == "failure" ]]; then
            echo "::error::Terraform plan failed"
            exit 1
          fi

          echo "Terraform gate passed (check=$check, plan=$plan)"
