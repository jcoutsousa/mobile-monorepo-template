name: Copilot Review Gate

on:
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  check-copilot-review:
    name: Copilot Review Status
    runs-on: ubuntu-latest
    # Only run when Copilot submits a review
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'pull_request_review' &&
       github.event.review.user.login == 'copilot-pull-request-reviewer[bot]')
    steps:
      - name: Check for Copilot critical findings
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request?.number ||
                             context.payload.review?.pull_request_url?.split('/').pop();

            if (!prNumber) {
              console.log('No PR number found, skipping');
              return;
            }

            // Get all reviews on the PR
            const reviews = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            // Find Copilot reviews
            const copilotReviews = reviews.data.filter(
              r => r.user.login === 'copilot-pull-request-reviewer[bot]'
            );

            if (copilotReviews.length === 0) {
              console.log('No Copilot review found yet. This is expected for new PRs.');
              console.log('Copilot will review the PR automatically if configured in rulesets.');
              return;
            }

            // Get review comments
            const comments = await github.rest.pulls.listReviewComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            const copilotComments = comments.data.filter(
              c => c.user.login === 'copilot-pull-request-reviewer[bot]'
            );

            // Check for severity indicators in Copilot's comments
            const criticalPatterns = [
              /security\s*(vulnerability|issue|risk)/i,
              /hardcoded\s*(secret|key|password|token|credential)/i,
              /sql\s*injection/i,
              /xss|cross.site.scripting/i,
              /authentication\s*bypass/i,
              /data\s*leak/i,
              /\bblocking\b/i,
              /\bcritical\b/i,
            ];

            let criticalFindings = [];
            for (const comment of copilotComments) {
              for (const pattern of criticalPatterns) {
                if (pattern.test(comment.body)) {
                  criticalFindings.push({
                    file: comment.path,
                    line: comment.line,
                    body: comment.body.substring(0, 200),
                  });
                  break;
                }
              }
            }

            if (criticalFindings.length > 0) {
              console.log(`::error::Copilot found ${criticalFindings.length} critical issue(s):`);
              for (const finding of criticalFindings) {
                console.log(`  - ${finding.file}:${finding.line}: ${finding.body}`);
              }
              core.setFailed(
                `Copilot code review found ${criticalFindings.length} critical issue(s). ` +
                `Please address them before merging.`
              );
            } else {
              console.log(`✅ Copilot review completed with ${copilotComments.length} comment(s), no critical issues.`);
            }
