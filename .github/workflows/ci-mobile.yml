name: CI — Mobile

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      flutter: ${{ steps.changes.outputs.flutter }}
      react-native: ${{ steps.changes.outputs.react-native }}
      kotlin: ${{ steps.changes.outputs.kotlin }}
      swift: ${{ steps.changes.outputs.swift }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            flutter:
              - 'apps/flutter_*/**'
              - 'packages/flutter_*/**'
              - 'packages/dart_*/**'
            react-native:
              - 'apps/rn_*/**'
              - 'apps/react_native_*/**'
              - 'packages/rn_*/**'
            kotlin:
              - 'apps/kotlin_*/**'
              - 'apps/kmp_*/**'
              - 'packages/kotlin_*/**'
              - 'packages/kmp_*/**'
            swift:
              - 'apps/ios_*/**'
              - 'apps/swift_*/**'
              - 'packages/swift_*/**'

  # ─── Flutter CI ────────────────────────────────────────────
  flutter-ci:
    name: Flutter CI
    needs: detect-changes
    if: needs.detect-changes.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: ${{ fromJson(needs.detect-changes.outputs.flutter == 'true' && '["flutter"]' || '[]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Find Flutter apps
        id: find-apps
        run: |
          apps=$(find apps -maxdepth 1 -name "flutter_*" -type d | tr '\n' ' ')
          echo "apps=$apps" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: |
          for app in ${{ steps.find-apps.outputs.apps }}; do
            echo "::group::$app"
            cd $app && flutter pub get && cd -
            echo "::endgroup::"
          done

      - name: Analyze
        run: |
          for app in ${{ steps.find-apps.outputs.apps }}; do
            echo "::group::$app — flutter analyze"
            cd $app && flutter analyze --no-fatal-infos && cd -
            echo "::endgroup::"
          done

      - name: Test
        run: |
          for app in ${{ steps.find-apps.outputs.apps }}; do
            echo "::group::$app — flutter test"
            cd $app && flutter test --coverage && cd -
            echo "::endgroup::"
          done

  # ─── React Native CI ──────────────────────────────────────
  react-native-ci:
    name: React Native CI
    needs: detect-changes
    if: needs.detect-changes.outputs.react-native == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Find RN apps
        id: find-apps
        run: |
          apps=$(find apps -maxdepth 1 \( -name "rn_*" -o -name "react_native_*" \) -type d | tr '\n' ' ')
          echo "apps=$apps" >> $GITHUB_OUTPUT

      - name: Install & Lint & Test
        run: |
          for app in ${{ steps.find-apps.outputs.apps }}; do
            echo "::group::$app"
            cd $app
            npm ci
            npx eslint . --max-warnings 0
            npx tsc --noEmit
            npm test -- --coverage --watchAll=false
            cd -
            echo "::endgroup::"
          done

  # ─── Kotlin CI ─────────────────────────────────────────────
  kotlin-ci:
    name: Kotlin CI
    needs: detect-changes
    if: needs.detect-changes.outputs.kotlin == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Find Kotlin apps
        id: find-apps
        run: |
          apps=$(find apps -maxdepth 1 \( -name "kotlin_*" -o -name "kmp_*" \) -type d | tr '\n' ' ')
          echo "apps=$apps" >> $GITHUB_OUTPUT

      - name: Build & Test
        run: |
          for app in ${{ steps.find-apps.outputs.apps }}; do
            echo "::group::$app"
            cd $app
            ./gradlew detekt 2>/dev/null || echo "detekt not configured, skipping"
            ./gradlew test
            cd -
            echo "::endgroup::"
          done

  # ─── Gate ──────────────────────────────────────────────────
  ci-gate:
    name: CI Gate
    if: always()
    needs: [detect-changes, flutter-ci, react-native-ci, kotlin-ci]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          results="${{ needs.flutter-ci.result }} ${{ needs.react-native-ci.result }} ${{ needs.kotlin-ci.result }}"
          for result in $results; do
            if [[ "$result" == "failure" ]]; then
              echo "::error::One or more CI jobs failed"
              exit 1
            fi
          done
          echo "All CI checks passed or were skipped"
