name: Code Quality Gate

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write

jobs:
  quality-sweep:
    name: Code Quality Sweep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed
        run: |
          files=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$files" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # Detect which frameworks are affected
          echo "has_dart=$(echo "$files" | grep -c '\.dart$' || true)" >> $GITHUB_OUTPUT
          echo "has_ts=$(echo "$files" | grep -cE '\.(ts|tsx|js|jsx)$' || true)" >> $GITHUB_OUTPUT
          echo "has_kotlin=$(echo "$files" | grep -cE '\.(kt|kts)$' || true)" >> $GITHUB_OUTPUT
          echo "has_python=$(echo "$files" | grep -c '\.py$' || true)" >> $GITHUB_OUTPUT
          echo "has_go=$(echo "$files" | grep -c '\.go$' || true)" >> $GITHUB_OUTPUT
          echo "has_rust=$(echo "$files" | grep -c '\.rs$' || true)" >> $GITHUB_OUTPUT
          echo "has_vue=$(echo "$files" | grep -c '\.vue$' || true)" >> $GITHUB_OUTPUT
          echo "has_svelte=$(echo "$files" | grep -c '\.svelte$' || true)" >> $GITHUB_OUTPUT

      # ─── Dart / Flutter checks ───────────────────────────
      - name: Setup Flutter
        if: steps.changed.outputs.has_dart != '0'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter analyze
        if: steps.changed.outputs.has_dart != '0'
        run: |
          for dir in $(find apps packages -maxdepth 1 -name "flutter_*" -o -name "dart_*" 2>/dev/null); do
            if [ -f "$dir/pubspec.yaml" ]; then
              echo "::group::Analyzing $dir"
              cd $dir && flutter pub get && flutter analyze --no-fatal-infos && cd -
              echo "::endgroup::"
            fi
          done

      - name: Dart unused imports check
        if: steps.changed.outputs.has_dart != '0'
        run: |
          violations=""
          while IFS= read -r file; do
            if [ -f "$file" ]; then
              unused=$(grep -n "^import " "$file" | head -50)
              # Simple heuristic: flag files with >10 imports
              count=$(echo "$unused" | wc -l)
              if [ "$count" -gt 10 ]; then
                violations="$violations\n⚠️ $file has $count imports — review for unused"
              fi
            fi
          done <<< "$(echo "${{ steps.changed.outputs.files }}" | grep '\.dart$')"
          if [ -n "$violations" ]; then
            echo -e "::warning::Potential unused imports:$violations"
          fi

      # ─── TypeScript / React Native / Web checks ─────────
      - name: Setup Node
        if: steps.changed.outputs.has_ts != '0' || steps.changed.outputs.has_vue != '0' || steps.changed.outputs.has_svelte != '0'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ESLint check
        if: steps.changed.outputs.has_ts != '0' || steps.changed.outputs.has_vue != '0' || steps.changed.outputs.has_svelte != '0'
        run: |
          for dir in $(find apps packages -maxdepth 1 \( -name "rn_*" -o -name "react_native_*" \) 2>/dev/null; find web backends -maxdepth 1 -mindepth 1 -type d 2>/dev/null); do
            if [ -f "$dir/package.json" ]; then
              echo "::group::Linting $dir"
              cd $dir && npm ci && npx eslint . --max-warnings 0 && cd -
              echo "::endgroup::"
            fi
          done

      # ─── Kotlin checks ──────────────────────────────────
      - name: Setup Java
        if: steps.changed.outputs.has_kotlin != '0'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Detekt check
        if: steps.changed.outputs.has_kotlin != '0'
        run: |
          for dir in $(find apps packages -maxdepth 1 \( -name "kotlin_*" -o -name "kmp_*" \) 2>/dev/null); do
            if [ -f "$dir/build.gradle.kts" ] || [ -f "$dir/build.gradle" ]; then
              echo "::group::Detekt $dir"
              cd $dir && ./gradlew detekt 2>/dev/null && cd - || echo "detekt not configured"
              echo "::endgroup::"
            fi
          done

      # ─── Python checks ──────────────────────────────────
      - name: Setup Python
        if: steps.changed.outputs.has_python != '0'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python lint (ruff)
        if: steps.changed.outputs.has_python != '0'
        run: |
          pip install ruff
          # Lint changed Python files and any Python projects in backends/
          changed_py=$(echo "${{ steps.changed.outputs.files }}" | grep '\.py$' || true)
          if [ -n "$changed_py" ]; then
            echo "::group::Ruff check on changed files"
            echo "$changed_py" | xargs ruff check 2>/dev/null || true
            echo "::endgroup::"
          fi
          for dir in $(find apps packages web backends -maxdepth 1 -mindepth 1 -type d 2>/dev/null); do
            if [ -f "$dir/pyproject.toml" ] || [ -f "$dir/requirements.txt" ]; then
              py_files=$(find "$dir" -name "*.py" -not -path "*/.*" 2>/dev/null | head -1)
              if [ -n "$py_files" ]; then
                echo "::group::Ruff check $dir"
                ruff check "$dir" 2>/dev/null || true
                echo "::endgroup::"
              fi
            fi
          done

      # ─── Go checks ──────────────────────────────────────
      - name: Setup Go
        if: steps.changed.outputs.has_go != '0'
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Go vet
        if: steps.changed.outputs.has_go != '0'
        run: |
          for dir in $(find apps packages web backends -maxdepth 1 -mindepth 1 -type d 2>/dev/null); do
            if [ -f "$dir/go.mod" ]; then
              echo "::group::Go vet $dir"
              cd $dir && go vet ./... && cd -
              echo "::endgroup::"
            fi
          done

      # ─── Rust checks ────────────────────────────────────
      - name: Setup Rust
        if: steps.changed.outputs.has_rust != '0'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cargo clippy
        if: steps.changed.outputs.has_rust != '0'
        run: |
          for dir in $(find apps packages web backends -maxdepth 1 -mindepth 1 -type d 2>/dev/null); do
            if [ -f "$dir/Cargo.toml" ]; then
              echo "::group::Clippy $dir"
              cd $dir && cargo clippy -- -D warnings 2>/dev/null && cd - || echo "clippy check completed with warnings"
              echo "::endgroup::"
            fi
          done

      # ─── Cross-language quality checks ───────────────────
      # Secret scanning handled by Security Gate (Trivy) — see security-gate.yml

      - name: Check for TODO/FIXME in new code
        run: |
          echo "Checking for TODO/FIXME comments..."
          todos=$(git diff origin/${{ github.base_ref }}...HEAD | grep "^+" | grep -iE "(TODO|FIXME|HACK|XXX)" || true)
          if [ -n "$todos" ]; then
            echo "::warning::New TODO/FIXME comments found in this PR:"
            echo "$todos"
          fi

      - name: Check for duplicate constants
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: |
          echo "Checking for potential duplicate constants..."
          colors=""
          while IFS= read -r file; do
            [ -f "$file" ] || continue
            result=$(grep -rnE "(Color\(0x|Color\.fromARGB|#[0-9a-fA-F]{6})" -- "$file" 2>/dev/null || true)
            if [ -n "$result" ]; then
              if [ -z "$colors" ]; then
                colors="$result"
              else
                colors="$colors"$'\n'"$result"
              fi
            fi
          done <<< "$CHANGED_FILES"
          if [ -n "$colors" ]; then
            dupes=$(echo "$colors" | awk -F: '{print $NF}' | sort | uniq -d)
            if [ -n "$dupes" ]; then
              echo "::warning::Potential duplicate color constants:"
              echo "$dupes"
            fi
          fi
