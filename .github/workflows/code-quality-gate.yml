name: Code Quality Gate

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write

jobs:
  quality-sweep:
    name: Code Quality Sweep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed
        run: |
          files=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$files" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # Detect which frameworks are affected using plugins
          for fw_file in frameworks/*.sh; do
            [ ! -f "$fw_file" ] && continue
            base=$(basename "$fw_file" .sh)
            [ "$base" = "_template" ] && continue

            FRAMEWORK_EXTENSIONS=()
            source "$fw_file"

            has_match="false"
            for ext in "${FRAMEWORK_EXTENSIONS[@]}"; do
              escaped=$(echo "$ext" | sed 's/\./\\./g')
              if echo "$files" | grep -qE "${escaped}$"; then
                has_match="true"
                break
              fi
            done
            echo "has_${base}=${has_match}" >> $GITHUB_OUTPUT
          done

      # ─── Conditional SDK setup ─────────────────────────────
      - name: Setup Flutter
        if: steps.changed.outputs.has_flutter == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Node
        if: steps.changed.outputs.has_react-native == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        if: steps.changed.outputs.has_kotlin == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Python
        if: steps.changed.outputs.has_python == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Go
        if: steps.changed.outputs.has_go == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # ─── Run framework-specific linters via plugins ────────
      - name: Framework-specific lint checks
        run: |
          for fw_file in frameworks/*.sh; do
            [ ! -f "$fw_file" ] && continue
            base=$(basename "$fw_file" .sh)
            [ "$base" = "_template" ] && continue

            FRAMEWORK_NAME=""
            FRAMEWORK_PREFIXES=()
            FRAMEWORK_DETECT_FILE=""
            FRAMEWORK_EXTENSIONS=()
            FRAMEWORK_LINT_CMD=""
            FRAMEWORK_INSTALL_CMD=""
            source "$fw_file"

            # Check if this framework has changed files
            has_match="false"
            for ext in "${FRAMEWORK_EXTENSIONS[@]}"; do
              escaped=$(echo "$ext" | sed 's/\./\\./g')
              if echo "${{ steps.changed.outputs.files }}" | grep -qE "${escaped}$"; then
                has_match="true"
                break
              fi
            done

            [ "$has_match" = "false" ] && continue
            [ -z "$FRAMEWORK_LINT_CMD" ] && continue

            echo "::group::$FRAMEWORK_NAME quality checks"
            for prefix in "${FRAMEWORK_PREFIXES[@]}"; do
              for dir in $(find apps packages -maxdepth 1 -name "${prefix}*" -type d 2>/dev/null); do
                if [ -f "$dir/$FRAMEWORK_DETECT_FILE" ]; then
                  echo "Checking $dir..."
                  if [ -n "$FRAMEWORK_INSTALL_CMD" ]; then
                    (cd "$dir" && eval "$FRAMEWORK_INSTALL_CMD" 2>/dev/null) || true
                  fi
                  (cd "$dir" && eval "$FRAMEWORK_LINT_CMD") || true
                fi
              done
            done
            echo "::endgroup::"
          done

      # ─── Cross-language quality checks ─────────────────────
      - name: Check for hardcoded secrets
        run: |
          echo "Scanning for potential secrets in changed files..."
          patterns='(api[_-]?key|api[_-]?secret|password|token|secret[_-]?key|private[_-]?key)\s*[:=]\s*["\x27][^"\x27]{8,}'
          violations=$(grep -rnEi "$patterns" ${{ steps.changed.outputs.files }} 2>/dev/null || true)
          if [ -n "$violations" ]; then
            echo "::error::Potential hardcoded secrets detected:"
            echo "$violations"
            exit 1
          fi
          echo "No hardcoded secrets found"

      - name: Check for TODO/FIXME in new code
        run: |
          echo "Checking for TODO/FIXME comments..."
          todos=$(git diff origin/${{ github.base_ref }}...HEAD | grep "^+" | grep -iE "(TODO|FIXME|HACK|XXX)" || true)
          if [ -n "$todos" ]; then
            echo "::warning::New TODO/FIXME comments found in this PR:"
            echo "$todos"
          fi

      - name: Check for duplicate constants
        run: |
          echo "Checking for potential duplicate constants..."
          colors=$(grep -rnE "(Color\(0x|Color\.fromARGB|#[0-9a-fA-F]{6}|rgba?\()" ${{ steps.changed.outputs.files }} 2>/dev/null || true)
          if [ -n "$colors" ]; then
            dupes=$(echo "$colors" | awk -F: '{print $NF}' | sort | uniq -d)
            if [ -n "$dupes" ]; then
              echo "::warning::Potential duplicate color constants:"
              echo "$dupes"
            fi
          fi
