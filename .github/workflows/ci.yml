name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      flutter: ${{ steps.changes.outputs.flutter }}
      react-native: ${{ steps.changes.outputs.react-native }}
      kotlin: ${{ steps.changes.outputs.kotlin }}
      swift: ${{ steps.changes.outputs.swift }}
      web: ${{ steps.changes.outputs.web }}
      backend: ${{ steps.changes.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            flutter:
              - 'apps/flutter_*/**'
              - 'packages/flutter_*/**'
              - 'packages/dart_*/**'
            react-native:
              - 'apps/rn_*/**'
              - 'apps/react-native_*/**'
              - 'apps/react_native_*/**'
              - 'packages/rn_*/**'
            kotlin:
              - 'apps/kotlin_*/**'
              - 'apps/kmp_*/**'
              - 'packages/kotlin_*/**'
              - 'packages/kmp_*/**'
            swift:
              - 'apps/ios_*/**'
              - 'apps/swift_*/**'
              - 'packages/swift_*/**'
            web:
              - 'web/**'
              - 'packages/node_*/**'
            backend:
              - 'backends/**'
              - 'packages/python_*/**'
              - 'packages/go_*/**'
              - 'packages/rust_*/**'
              - 'packages/node_*/**'

  # ─── Flutter CI ────────────────────────────────────────────
  flutter-ci:
    name: Flutter CI
    needs: detect-changes
    if: needs.detect-changes.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Find Flutter apps
        id: find-apps
        run: |
          apps=$(find apps packages -maxdepth 1 \( -name "flutter_*" -o -name "dart_*" \) -type d 2>/dev/null | tr '\n' ' ')
          echo "apps=$apps" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: |
          for app in ${{ steps.find-apps.outputs.apps }}; do
            echo "::group::$app"
            cd $app && flutter pub get && cd -
            echo "::endgroup::"
          done

      - name: Analyze
        run: |
          for app in ${{ steps.find-apps.outputs.apps }}; do
            echo "::group::$app — flutter analyze"
            cd $app && flutter analyze --no-fatal-infos && cd -
            echo "::endgroup::"
          done

      - name: Test
        run: |
          for app in ${{ steps.find-apps.outputs.apps }}; do
            echo "::group::$app — flutter test"
            cd $app && flutter test --coverage && cd -
            echo "::endgroup::"
          done

  # ─── React Native CI ──────────────────────────────────────
  react-native-ci:
    name: React Native CI
    needs: detect-changes
    if: needs.detect-changes.outputs.react-native == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Find RN apps
        id: find-apps
        run: |
          apps=$(find apps -maxdepth 1 \( -name "rn_*" -o -name "react_native_*" \) -type d | tr '\n' ' ')
          echo "apps=$apps" >> $GITHUB_OUTPUT

      - name: Install & Lint & Test
        run: |
          for app in ${{ steps.find-apps.outputs.apps }}; do
            echo "::group::$app"
            cd $app
            npm ci
            npx eslint . --max-warnings 0
            npx tsc --noEmit
            npm test -- --coverage --watchAll=false
            cd -
            echo "::endgroup::"
          done

  # ─── Kotlin CI ─────────────────────────────────────────────
  kotlin-ci:
    name: Kotlin CI
    needs: detect-changes
    if: needs.detect-changes.outputs.kotlin == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Find Kotlin apps
        id: find-apps
        run: |
          apps=$(find apps -maxdepth 1 \( -name "kotlin_*" -o -name "kmp_*" \) -type d | tr '\n' ' ')
          echo "apps=$apps" >> $GITHUB_OUTPUT

      - name: Build & Test
        run: |
          for app in ${{ steps.find-apps.outputs.apps }}; do
            echo "::group::$app"
            cd $app
            ./gradlew detekt 2>/dev/null || echo "detekt not configured, skipping"
            ./gradlew test
            cd -
            echo "::endgroup::"
          done

  # ─── Swift CI ──────────────────────────────────────────────
  swift-ci:
    name: Swift CI
    needs: detect-changes
    if: needs.detect-changes.outputs.swift == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find Swift apps
        id: find-apps
        run: |
          apps=$(find apps packages -maxdepth 1 \( -name "ios_*" -o -name "swift_*" \) -type d 2>/dev/null | tr '\n' ' ')
          echo "apps=$apps" >> $GITHUB_OUTPUT

      - name: Build & Test
        run: |
          for app in ${{ steps.find-apps.outputs.apps }}; do
            echo "::group::$app"
            cd $app
            if [ -f "Package.swift" ]; then
              swift build
              swift test
            elif [ -d "*.xcodeproj" ] || [ -d "*.xcworkspace" ]; then
              xcodebuild -scheme "$(xcodebuild -list -json 2>/dev/null | python3 -c 'import json,sys; print(json.load(sys.stdin)["project"]["schemes"][0])' 2>/dev/null || echo 'default')" \
                -sdk iphonesimulator \
                -destination 'platform=iOS Simulator,name=iPhone 15' \
                clean test 2>/dev/null || echo "xcodebuild test failed or not configured"
            fi
            cd -
            echo "::endgroup::"
          done

  # ─── Web CI ────────────────────────────────────────────────
  web-ci:
    name: Web CI
    needs: detect-changes
    if: needs.detect-changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Find web projects
        id: find-apps
        run: |
          apps=$(find web -maxdepth 1 -mindepth 1 -type d 2>/dev/null | tr '\n' ' ')
          echo "apps=$apps" >> $GITHUB_OUTPUT

      - name: Install & Lint & Test & Build
        run: |
          for app in ${{ steps.find-apps.outputs.apps }}; do
            [ -f "$app/package.json" ] || continue
            echo "::group::$app"
            cd $app
            npm ci

            # Lint
            if npx eslint --version >/dev/null 2>&1; then
              npx eslint . --max-warnings 0 || true
            fi

            # Type-check (if TypeScript)
            if [ -f "tsconfig.json" ]; then
              npx tsc --noEmit || true
            fi

            # Test
            if grep -q '"test"' package.json; then
              npm test -- --watchAll=false --passWithNoTests || true
            fi

            # Build
            if grep -q '"build"' package.json; then
              npm run build
            fi

            cd -
            echo "::endgroup::"
          done

  # ─── Backend CI ────────────────────────────────────────────
  backend-ci:
    name: Backend CI
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find backend projects
        id: find-backends
        run: |
          backends=$(find backends -maxdepth 1 -mindepth 1 -type d 2>/dev/null | tr '\n' ' ')
          echo "backends=$backends" >> $GITHUB_OUTPUT

      - name: Setup runtimes
        run: |
          for dir in ${{ steps.find-backends.outputs.backends }}; do
            if [ -f "$dir/package.json" ]; then
              echo "node_needed=true" >> $GITHUB_ENV
            elif [ -f "$dir/requirements.txt" ] || [ -f "$dir/pyproject.toml" ]; then
              echo "python_needed=true" >> $GITHUB_ENV
            elif [ -f "$dir/go.mod" ]; then
              echo "go_needed=true" >> $GITHUB_ENV
            elif [ -f "$dir/Cargo.toml" ]; then
              echo "rust_needed=true" >> $GITHUB_ENV
            fi
          done

      - uses: actions/setup-node@v4
        if: env.node_needed == 'true'
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        if: env.python_needed == 'true'
        with:
          python-version: '3.12'

      - uses: actions/setup-go@v5
        if: env.go_needed == 'true'
        with:
          go-version: '1.22'

      - uses: dtolnay/rust-toolchain@stable
        if: env.rust_needed == 'true'

      - name: Lint & Test backends
        run: |
          for dir in ${{ steps.find-backends.outputs.backends }}; do
            echo "::group::$dir"

            if [ -f "$dir/package.json" ]; then
              echo "── Node.js backend: $dir"
              cd $dir && npm ci
              npx eslint . --max-warnings 0 2>/dev/null || true
              npm test -- --watchAll=false --passWithNoTests 2>/dev/null || npm test 2>/dev/null || true
              cd -

            elif [ -f "$dir/pyproject.toml" ] || [ -f "$dir/requirements.txt" ]; then
              echo "── Python backend: $dir"
              cd $dir
              pip install -e ".[dev]" 2>/dev/null || pip install -r requirements.txt 2>/dev/null || true
              ruff check . 2>/dev/null || flake8 . 2>/dev/null || true
              pytest 2>/dev/null || python -m pytest 2>/dev/null || true
              cd -

            elif [ -f "$dir/go.mod" ]; then
              echo "── Go backend: $dir"
              cd $dir
              golangci-lint run 2>/dev/null || go vet ./... || true
              go test ./...
              cd -

            elif [ -f "$dir/Cargo.toml" ]; then
              echo "── Rust backend: $dir"
              cd $dir
              cargo clippy -- -D warnings 2>/dev/null || true
              cargo test
              cd -
            fi

            echo "::endgroup::"
          done

  # ─── Gate ──────────────────────────────────────────────────
  ci-gate:
    name: CI Gate
    if: always()
    needs: [detect-changes, flutter-ci, react-native-ci, kotlin-ci, swift-ci, web-ci, backend-ci]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          results="${{ needs.flutter-ci.result }} ${{ needs.react-native-ci.result }} ${{ needs.kotlin-ci.result }} ${{ needs.swift-ci.result }} ${{ needs.web-ci.result }} ${{ needs.backend-ci.result }}"
          for result in $results; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "::error::One or more CI jobs failed or were cancelled (got: $result)"
              exit 1
            fi
          done
          echo "All CI checks passed or were skipped"
